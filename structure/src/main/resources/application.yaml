server:
  servlet:
    context-path: /api
  port: 8080
spring:
  application:
    name: structure
  profiles:
    active: @spring.profiles.active@
  datasource:
    driver-class-name: ${patriclee.datasource.driver-class-name}
    # 数据库连接信息
    url: jdbc:mysql://${patriclee.datasource.host}:${patriclee.datasource.port}/${patriclee.datasource.database}?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${patriclee.datasource.username}
    password: ${patriclee.datasource.password}
    type: com.alibaba.druid.pool.DruidDataSource

    druid: # Druid 连接池
      initial-size: 5 # 初始化连接池大小
      min-idle: 5 # 最小连接池数量
      max-active: 20 # 最大连接池数量
      max-wait: 60000 # 连接时最大等待时间（单位：毫秒）
      test-while-idle: true
      time-between-eviction-runs-millis: 60000 # 配置多久进行一次检测，检测需要关闭的连接（单位：毫秒）
      min-evictable-idle-time-millis: 300000 # 配置一个连接在连接池中最小生存的时间（单位：毫秒）
      max-evictable-idle-time-millis: 900000 # 配置一个连接在连接池中最大生存的时间（单位：毫秒）
      validation-query: SELECT 1 FROM DUAL # 配置测试连接是否可用的查询 sql
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: false
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        url-pattern: ${patriclee.datasource.druid.url-pattern}
        login-username: ${patriclee.datasource.druid.login-username}
        login-password: ${patriclee.datasource.druid.login-password}
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 开启慢 sql 记录
          slow-sql-millis: 2000 # 若执行耗时大于 2s，则视为慢 sql
          merge-sql: true
        wall: # 防火墙
          config:
            multi-statement-allow: true
  data:
    redis:
      host: ${patriclee.redis.host}
      port: ${patriclee.redis.port}
      database: ${patriclee.redis.database}
      password: ${patriclee.redis.password}
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 链接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接
  servlet:
    multipart:
      max-file-size: 2GB # 限制单个上传文件的最大大小为 2GB。如果上传的文件大小超过这个值，将会被拒绝上传。
      max-request-size: 2GB # 限制整个上传请求的最大大小为 2GB。这包括所有上传文件的大小之和。如果请求总大小超过这个值，将会被拒绝
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/init.sql
    #SpringAI 配置
    chat:
      memory:
        repository:
          jdbc:
            mysql:
              jdbc-url: jdbc:mysql://${patriclee.datasource.host}:${patriclee.datasource.port}/${patriclee.datasource.database}?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
              username: ${patriclee.datasource.username}
              password: ${patriclee.datasource.password}
              driver-class-name: ${patriclee.datasource.driver-class-name}
              enabled: true


# MyBatis配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.patriclee.domain.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/*Mapper.xml
  # 加载全局的配置文件注释
  configuration:
    # 自动驼峰命名
    map-underscore-to-camel-case: true
    # 添加日志配置
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: delFlag       # 全局逻辑删除字段名
      logic-delete-value: 1             # 删除时的值
      logic-not-delete-value: 0         # 未删除的值

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  jwt-secret-key: patriclee-factory-secret-key

# springdoc-openapi项目配置
springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
    path: /v3/api-docs  #swagger后端请求地址
  swagger-ui:
    #自定义swagger前端请求路径,输入http:localhost:8080/swagger-ui会自动重定向到swagger页面
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    # 标题
    title: 'NOF0_管理系统_接口文档'
    # 描述
    description: '用于管理NOF0业务信息'
    # 版本
    version: '版本号: 1.0.0'
    # 作者信息
    contact:
      name: Patriclee
      email: cyhlbh2010@gmail.com
      url: https://github.com/patricleehua
  components:
    # 鉴权方式配置
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: ${sa-token.token-name}
  group-configs: #分组配置,可配置多个分组
    - group: 'system'
      packages-to-scan: com.patriclee.controller
#    - group: '2.业务模块'
#      packages-to-scan: com.patriclee.controller.business
#    - group: '3.通用模块'
#      packages-to-scan: com.patriclee.controller



logging:
  file:
    name: spring_log.log
    path: ./logs
  config: classpath:logback-spring.xml
  logstash:
    host: us.shumei.gq:4560
  level:
    root: info
    com:
      patriclee: debug

patriclee:
  salt: ${patriclee.salt}

