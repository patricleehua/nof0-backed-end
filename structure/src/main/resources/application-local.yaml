patriclee:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: nof0-backed-end
    username: root
    password: 123456
    druid:
      url-pattern: /druid/* # 配置监控后台访问路径
      login-username: admin # 配置监控后台登录的用户名、密码
      login-password: admin
  redis:
    host: localhost
    port: 6379
    database: 3
    password: 123456
    lettuce:
      pool:
        max-active: 8 #最大连接数
        max-idle: 8 #最大空闲连接数
        min-idle: 0 #最小空闲连接
        max-wait: 100ms #最大等待时长

  salt: patriclee-salt

  ai:
    provider:
      providers:
        open-router:
          base-url: https://openrouter.ai/api
          api-keys:
            - sk-or-v1-xxxx
          default-model: openai/gpt-5-mini
          available-models:
            - openai/gpt-4o
            - openai/gpt-4o-mini
            - openai/gpt-5-mini
          timeout: 30000
          max-retries: 3
          enabled: true
        gemini:
          base-url: https://generativelanguage.googleapis.com
          api-keys:
            - AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          default-model: gemini-2.0-flash-exp
          timeout: 30000
          max-retries: 3
          enabled: true

        # 禁用的提供商示例
        example-disabled:
          enabled: false
          # 即使配置了密钥，也不会被使用
          apiKeys:
            - "disabled-key"